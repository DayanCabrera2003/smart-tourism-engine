[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
# T122: load tests live under tests/load/ and import locust, which
# monkey-patches SSL at import time and breaks every other test in the
# suite when collected automatically. Run them explicitly with
# `pytest tests/load/ -p no:cacheprovider` when needed.
norecursedirs = tests/load
addopts = -v --tb=short
log_cli = true
log_cli_level = INFO
asyncio_mode = auto
